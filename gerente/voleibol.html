<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
    <title>CODESP - Tela Inicial</title>
</head>
<body>
    
    <header class="header-superior">
        <nav>
            <i class="bi bi-arrow-left"></i>
            <h1>Voleibol</h1>
            <i class="bi bi-question-circle"></i>
        </nav>
    </header>

    <header class="header-inferior">
        <nav>
            <div>
                <i class="bi bi-house-door"></i>
                <p> Tela Inicial</p>
            </div>
            <div>
                <i class="bi bi-plus-circle"></i>
                <p>Criar Turmas</p>
            </div>
            <div>
                <i class="bi bi-person"></i>
                <p>Meu Perfil</p>
            </div>
        </nav>
    </header>

    <main>
      
        <div class="informacoes-turma">
            <h2>Informações gerais</h2>

            <ol>
                <li>
                    <i class="fa-solid fa-person-running"></i>
                    <p class="classificacao">
                        Modalidade:
                    </p>
                    <p class="informacao">
                        Voleibol
                    </p>
                </li>
                <li>
                    <i class="bi bi-calendar"></i>
                    <p class="classificacao">
                        Dias:
                    </p>
                    <p class="informacao">
                        segunda, terça e quarta
                    </p>
                </li>
                <li>
                    <i class="bi bi-clock"></i>
                    <p class="classificacao">
                        Horário
                    </p>
                    <p class="informacao">
                        9h-10h30
                    </p>
                </li>
                <li>
                    <i class="fa-solid fa-person-chalkboard"></i>
                    <p class="classificacao">
                        Professor(a);
                    </p>
                    <p class="informacao">
                        João Dias
                    </p>
                </li>
                <li>
                    <i class="bi bi-geo-alt"></i>
                    <p class="classificacao">
                        Local
                    </p>
                    <p class="informacao">
                        Ginásio
                    </p>
                </li>
            </ol>

            <div class="parte-betinho">
                <img src="../assets/Betinhos/betinho-voleibol.png" alt="">
            </div>
        </div>

        <div class="opcoes-gerente">
            <div class="linha-botoes">
                <button id="excluir">
                    <i class="bi bi-trash"></i>
                    Excluir
                </button>
                <button id="editar">
                    <i class="bi bi-pencil-square"></i>
                    Editar
                </button>
            </div>

            <button>
                <i class="bi bi-people"></i>
                Participantes
            </button>
            <button>
                <i class="bi bi-list-ul"></i>
                Lista de Espera
            </button>
        </div>

    </main>
    
</body>
</html>
