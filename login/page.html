<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Zain:ital,wght@0,200;0,300;0,400;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
    <title>CODESP - Tela Inicial</title>
</head>
<body>
    
    <div class="ola-sou-betinho">
        <div class="parte-imagem">
                <img src="../../assets/Betinhos/betinho-gerente-1.png" alt="betinho-gerente-2" class="betinho-gerente">
            </div>
            <!-- parte do texto -->
            <div class="parte-texto">
                <div>
                    <p id="ola">Olá!</p>
                    <p>Sou Betinho</p>
                </div>
        
            </div>
    </div>
    <main class="arredondado">


        <h2>Entrar</h2>

       <form action="login">

        <div>
            <label for="email">Email institucional</label>
            <input type="email" id="email" required>
        </div>

        <div>
            <label for="senha">Senha</label>
            <input type="password" id="senha">
        </div>

        <div class="opcoes-login">
            <div id="continuar-logado">
                <input type="checkbox" name="continuar-logado" id="">
                <p>continuar logado</p>
            </div>
            
            <a href="" id="esqueci-senha">Esqueci a senha</a>

        </div>

        <button type="submit">Entrar</button>
       </form>

       <p id="cadastro">Caso não possua conta,  <a href=""> cadastre-se</a>!</p>

       

    </main>
    
</body>
</html>
